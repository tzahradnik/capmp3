server {
    listen __PORT__;
    server_name _;

    # Static SEO files served directly by nginx
    location = /sitemap.xml {
        alias /app/static/sitemap.xml;
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        alias /app/static/robots.txt;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /og-image.png {
        alias /app/static/og-image.png;
        default_type "image/png";
        add_header Cache-Control "public, max-age=2592000";
    }

    # Health check for Render (and Railway) — answered by nginx directly
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type "text/plain";
    }

    # Everything else — proxy to Streamlit with WebSocket support
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;

        # Inject SellWithBoost badge so crawlers can verify it.
        # Streamlit renders via JS — crawlers never see st.markdown output.
        proxy_set_header   Accept-Encoding "";
        sub_filter '</body>' '<div style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;" aria-hidden="true"><h1>CapMP3 - Cap.so to MP3 Converter</h1><p>CapMP3 is a free online tool that converts cap.so and cap.link screen recordings to downloadable MP3 audio files. Paste any cap.so or cap.link URL and CapMP3 extracts the audio track, converts it to high-quality MP3, and delivers it straight to your browser. No software installation required. 1 free download, no credit card needed. Fast, secure, privacy-first audio converter for cap.so recordings.</p><a href="https://sellwithboost.com" target="_blank" rel="noopener noreferrer"><img src="https://sellwithboost.com/badge/listing-dark.svg" alt="Listed on Sell With boost" style="height:40px;width:auto;" /></a></div></body>';
        sub_filter_once    on;
        sub_filter_types   text/html;
    }
}
