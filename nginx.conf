server {
    listen __PORT__;
    server_name _;

    # Static SEO files served directly by nginx
    location = /sitemap.xml {
        alias /app/static/sitemap.xml;
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        alias /app/static/robots.txt;
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /og-image.png {
        alias /app/static/og-image.png;
        default_type "image/png";
        add_header Cache-Control "public, max-age=2592000";
    }

    # Everything else — proxy to Streamlit with WebSocket support
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
